{% extends "base.html" %}

{% block title %}Nouvelle tache - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Nouvelle tache</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('task.create') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Titre</label>
                        <input type="text" class="form-control" id="title" name="title" required
                               value="{{ form_data.get('title', '') if form_data else '' }}"
                               placeholder="Ex: Renouveler carte d'identite" autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"
                                  placeholder="Optionnel">{{ form_data.get('description', '') if form_data else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="due_date" class="form-label">Echeance</label>
                            <input type="date" class="form-control" id="due_date" name="due_date" required
                                   value="{{ form_data.get('due_date', '') if form_data else '' }}">
                        </div>
                        <div class="col-6 mb-3">
                            <label for="priority" class="form-label">Priorite</label>
                            <select class="form-select" id="priority" name="priority">
                                {% set sel_priority = form_data.get('priority', 'normal') if form_data else 'normal' %}
                                <option value="low" {% if sel_priority == 'low' %}selected{% endif %}>Basse</option>
                                <option value="normal" {% if sel_priority == 'normal' %}selected{% endif %}>Normale</option>
                                <option value="high" {% if sel_priority == 'high' %}selected{% endif %}>Haute</option>
                                <option value="urgent" {% if sel_priority == 'urgent' %}selected{% endif %}>Urgente</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="document_id" class="form-label">Document lie</label>
                            <select class="form-select" id="document_id" name="document_id">
                                <option value="">Aucun</option>
                                {% for doc in documents %}
                                <option value="{{ doc.id }}" {% if form_data and form_data.get('document_id') == doc.id|string %}selected{% endif %}>{{ doc.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="reminder_days" class="form-label">Rappel</label>
                            <select class="form-select" id="reminder_days" name="reminder_days">
                                {% set sel_reminder = form_data.get('reminder_days', '7') if form_data else '7' %}
                                <option value="1" {% if sel_reminder == '1' %}selected{% endif %}>1j avant</option>
                                <option value="3" {% if sel_reminder == '3' %}selected{% endif %}>3j avant</option>
                                <option value="7" {% if sel_reminder == '7' %}selected{% endif %}>7j avant</option>
                                <option value="14" {% if sel_reminder == '14' %}selected{% endif %}>14j avant</option>
                                <option value="30" {% if sel_reminder == '30' %}selected{% endif %}>30j avant</option>
                            </select>
                        </div>
                    </div>

                    {% if family_members %}
                    <div class="mb-3">
                        <label for="assigned_to_id" class="form-label">Assigner a</label>
                        <select class="form-select" id="assigned_to_id" name="assigned_to_id">
                            <option value="">Moi-meme</option>
                            {% for member in family_members %}
                            <option value="{{ member.user.id }}">{{ member.user.full_name }} ({{ member.family.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('task.list_tasks') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Creer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>document.getElementById('due_date').min = new Date().toISOString().split('T')[0];</script>
{% endblock %}
