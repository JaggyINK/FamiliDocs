{% extends "base.html" %}

{% block title %}Nouveau groupe - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Nouveau groupe familial</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('family.create_family') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nom du groupe</label>
                        <input type="text" class="form-control" id="name" name="name" required
                               maxlength="100" placeholder="Ex: Famille Dupont" autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"
                                  placeholder="Optionnel"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('family.list_families') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Creer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
