{% extends "base.html" %}

{% block title %}Modifier {{ folder.name }} - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Modifier le dossier</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('user.edit_folder', folder_id=folder.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="name" name="name" required value="{{ folder.name }}">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Categorie</label>
                        <select class="form-select" id="category" name="category">
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if folder.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2">{{ folder.description or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('user.view_folder', folder_id=folder.id) }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
