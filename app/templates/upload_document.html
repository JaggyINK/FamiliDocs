{% extends "base.html" %}

{% block title %}Ajouter un document - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Ajouter un document</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('document.upload') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Fichier</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                        <div class="form-text">PDF, Word, Excel, Images — max 16 Mo</div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ form_data.get('name', '') if form_data else '' }}"
                               placeholder="Automatique si vide">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="folder_id" class="form-label">Dossier</label>
                            <select class="form-select" id="folder_id" name="folder_id">
                                <option value="">Racine</option>
                                {% for folder in folders %}
                                <option value="{{ folder.id }}" {% if form_data and form_data.get('folder_id') == folder.id|string %}selected{% endif %}>{{ folder.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="confidentiality" class="form-label">Acces</label>
                            <select class="form-select" id="confidentiality" name="confidentiality">
                                {% for key, label in confidentiality_levels.items() %}
                                <option value="{{ key }}" {% if form_data %}{% if form_data.get('confidentiality') == key %}selected{% endif %}{% elif key == 'private' %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="expiry_date" class="form-label">Echeance</label>
                        <input type="date" class="form-control" id="expiry_date" name="expiry_date"
                               value="{{ form_data.get('expiry_date', '') if form_data else '' }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('document.list_documents') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
