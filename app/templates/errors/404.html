{% extends "base.html" %}

{% block title %}404 - FamiliDocs{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size: 5rem; font-weight: 800; letter-spacing: -0.05em; background: linear-gradient(135deg, var(--color-accent), #5856D6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">404</div>
    <h4 class="mt-2">Page introuvable</h4>
    <p class="text-muted mb-4">Cette page n'existe pas ou a ete deplacee.</p>
    <div class="d-flex justify-content-center gap-2">
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">Accueil</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Connexion</a>
        {% endif %}
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Retour</a>
    </div>
</div>
{% endblock %}
