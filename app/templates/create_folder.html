{% extends "base.html" %}

{% block title %}Nouveau dossier - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Nouveau dossier</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('user.create_folder') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="name" name="name" required
                               maxlength="100" placeholder="Ex: Assurance habitation" autofocus>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">Categorie</label>
                            <select class="form-select" id="category" name="category">
                                {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="parent_id" class="form-label">Dossier parent</label>
                            <select class="form-select" id="parent_id" name="parent_id">
                                <option value="">Racine</option>
                                {% for folder in parent_folders %}
                                <option value="{{ folder.id }}">{{ folder.get_path() }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"
                                  placeholder="Optionnel"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('user.folders') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Creer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
