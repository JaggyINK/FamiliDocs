{% extends "base.html" %}

{% block title %}Mot de passe - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Changer le mot de passe</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.change_password') }}">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Mot de passe actuel</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Nouveau mot de passe</label>
                        <input type="password" class="form-control" id="password" name="new_password" required minlength="8">
                        <div class="mt-2">
                            <div class="progress" style="height: 4px; border-radius: 4px;">
                                <div class="progress-bar" id="passwordStrengthBar" role="progressbar" style="width: 0%; transition: width 0.3s ease, background-color 0.3s ease;"></div>
                            </div>
                            <small id="passwordStrengthText" class="text-muted" style="font-size: 0.7rem;"></small>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">Confirmer</label>
                        <input type="password" class="form-control" id="password_confirm" name="new_password_confirm" required>
                        <div id="passwordMatch" class="mt-2" style="font-size: 0.7rem;"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('user.profile') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    var pwd = document.getElementById('password');
    var confirm = document.getElementById('password_confirm');
    var bar = document.getElementById('passwordStrengthBar');
    var text = document.getElementById('passwordStrengthText');
    var matchDiv = document.getElementById('passwordMatch');

    pwd.addEventListener('input', function() {
        var v = pwd.value, score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[a-z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^a-zA-Z0-9]/.test(v)) score++;
        bar.style.width = (score / 5 * 100) + '%';
        var colors = ['','bg-danger','bg-warning','bg-info','bg-primary','bg-success'];
        var labels = ['','Faible','Moyen','Correct','Fort','Excellent'];
        bar.className = 'progress-bar ' + (colors[score] || '');
        text.textContent = v ? (labels[score] || '') : '';
        if (!v) bar.style.width = '0%';
        checkMatch();
    });

    function checkMatch() {
        if (!confirm.value) { matchDiv.innerHTML = ''; return; }
        matchDiv.innerHTML = pwd.value === confirm.value
            ? '<span class="text-success"><i class="bi bi-check-circle-fill"></i> OK</span>'
            : '<span class="text-danger"><i class="bi bi-x-circle"></i> Differents</span>';
    }
    confirm.addEventListener('input', checkMatch);
})();
</script>
{% endblock %}
