{% extends "base.html" %}

{% block title %}Modifier {{ document.name }} - FamiliDocs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Modifier le document</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('document.edit', document_id=document.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="name" name="name" required value="{{ document.name }}">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2">{{ document.description or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="folder_id" class="form-label">Dossier</label>
                            <select class="form-select" id="folder_id" name="folder_id">
                                <option value="">Racine</option>
                                {% for folder in folders %}
                                <option value="{{ folder.id }}" {% if document.folder_id == folder.id %}selected{% endif %}>{{ folder.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="confidentiality" class="form-label">Acces</label>
                            <select class="form-select" id="confidentiality" name="confidentiality">
                                {% for level, label in confidentiality_levels.items() %}
                                <option value="{{ level }}" {% if document.confidentiality == level %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="expiry_date" class="form-label">Echeance</label>
                            <input type="date" class="form-control" id="expiry_date" name="expiry_date"
                                   value="{{ document.expiry_date.strftime('%Y-%m-%d') if document.expiry_date else '' }}">
                        </div>
                        <div class="col-6 mb-3">
                            <label for="next_review_date" class="form-label">Revision</label>
                            <input type="date" class="form-control" id="next_review_date" name="next_review_date"
                                   value="{{ document.next_review_date.strftime('%Y-%m-%d') if document.next_review_date else '' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-muted">{{ document.file_type }} — {{ document.get_human_readable_size() }}</small>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('document.view', document_id=document.id) }}" class="btn btn-outline-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
