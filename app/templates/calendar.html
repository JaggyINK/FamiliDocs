{% extends "base.html" %}

{% block title %}Calendrier - FamiliDocs{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
<style>
    #calendar { max-width: 100%; }
    .fc-event { cursor: pointer; border-radius: 6px; }
    .fc-toolbar-title { font-size: 1.2rem !important; font-weight: 600; }
    .fc-button { border-radius: 8px !important; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 style="font-size: 1.5rem; font-weight: 700;">Calendrier</h1>
    <div>
        <a href="{{ url_for('task.list_tasks') }}" class="btn btn-outline-secondary btn-sm me-1">Liste</a>
        <a href="{{ url_for('task.create') }}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Nouvelle
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <h6 id="taskModalTitle"></h6>
                <p class="text-muted small" id="taskModalDate"></p>
                <a href="#" class="btn btn-primary btn-sm" id="taskModalLink">Voir</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var events = [
        {% for event in events %}
        { id: {{ event.id|tojson }}, title: {{ event.title|tojson }}, start: {{ event.start|tojson }}, color: {{ event.color|tojson }}, url: {{ event.url|tojson }} }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];

    var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        locale: 'fr',
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listWeek' },
        events: events,
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            document.getElementById('taskModalTitle').textContent = info.event.title;
            document.getElementById('taskModalDate').textContent = new Date(info.event.start).toLocaleDateString('fr-FR');
            var link = document.getElementById('taskModalLink');
            link.href = info.event.url || '#';
            link.style.display = info.event.url ? '' : 'none';
            new bootstrap.Modal(document.getElementById('taskModal')).show();
        },
        dayMaxEvents: 3,
        moreLinkText: function(n) { return '+' + n; }
    });
    calendar.render();
});
</script>
{% endblock %}
